<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编辑模式</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Prompt CMS</p>
          <h1>编辑模式</h1>
          <p id="modeSubtitle" class="subtitle">切换到 Capsule 或 Issue，直接开始编辑。</p>
        </div>
      </header>

      <nav class="mode-tabs" aria-label="编辑模式切换">
        <button id="tabCapsule" class="mode-tab active" type="button">Capsule</button>
        <button id="tabIssue" class="mode-tab" type="button">Issue</button>
      </nav>

      <div class="workspace">
        <main class="main-column">
          <section id="modePrimary"></section>
          <section id="modeSecondary"></section>
        </main>
        <aside id="modeSide" class="side-column"></aside>
      </div>
    </div>

    <div id="floatingSuggestion" class="floating-suggestion hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
